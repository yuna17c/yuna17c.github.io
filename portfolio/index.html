<!DOCTYPE html>
<html lang="en">
<head>

<body class="world-page">

  <header class="world-header">
    <a href="index.html" class="logo" aria-label="Home">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M2 11L12 2L22 11H19V21H14V15H10V21H5V11Z"
              fill="currentColor"/>

    <div class="header-right">
      <a href="https://github.com/yuna17c"
        target="_blank"
        rel="noopener noreferrer"
        class="social-link">
        <i class="fa-brands fa-github"></i>
        <span>GitHub</span>
      </a>

      <a href="https://linkedin.com/in/YOUR_USERNAME"
        target="_blank"
        rel="noopener noreferrer"
        class="social-link">
        <i class="fa-brands fa-linkedin"></i>
        <span>LinkedIn</span>
      </a>

      <a href="mailto:yunachoi621@gmail.com" class="header-contact">SAY HELLO ↗</a>

        <p class="world-subtitle">

=

            <rect x="75" y="55" width="35" height="5" fill="#49352F"/>
            <rect x="85" y="60" width="25" height="5" fill="#49352F"/>

            <rect x="50" y="115" width="60" height="45" fill="#D58C65"/>

            <rect x="76" y="115" width="8" height="8" fill="#F2DDBD"/>

            <rect x="43" y="140" width="10" height="8" fill="#E8B58F"/>

            <rect x="56" y="166" width="20" height="13" fill="#526D68"/>

          <span class="character-sparkle sparkle-one">✦</span>

        <div class="scene-ground"></div>

        <div class="scene-hint">
          <span class="hint-arrow">↓</span>
          CHOOSE YOUR ADVENTURE
        </div>

      </div>

      <!-- Main navigation -->
      <nav class="quest-menu" aria-label="Main navigation">

        <a href="work.html" class="quest-button quest-button--primary">
          <span class="quest-icon">⚔</span>
          <span class="quest-text">
            <strong>WORK LOG</strong>
            <small>My work & experience</small>
          </span>
          <span class="quest-arrow">↗</span>

        <a href="me.html" class="quest-button quest-button--secondary">
          <span class="quest-icon">✿</span>
          <span class="quest-text">
